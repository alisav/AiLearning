name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore AiLearning.slnx

      - name: Build
        run: dotnet build AiLearning.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test AiLearning.slnx --no-build --configuration Release
